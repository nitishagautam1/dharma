<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F1ECDE; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect } = React;

const QUOTES = [
  { text: "The good physician treats the disease; the great physician treats the patient who has the disease.", author: "William Osler", source: "widely attributed" },
  { text: "Medicine is a science of uncertainty and an art of probability.", author: "William Osler", source: "Sir William Osler: Aphorisms, no. 129" },
  { text: "He who studies medicine without books sails an uncharted sea, but he who studies medicine without patients does not go to sea at all.", author: "William Osler", source: "Aequanimitas, \"Books and Men,\" 1904" },
  { text: "The secret of the care of the patient is in caring for the patient.", author: "Francis Peabody", source: "\"The Care of the Patient,\" JAMA, 1927" },
  { text: "Medicine is the most scientific of the humanities and the most humane of the sciences.", author: "Edmund Pellegrino", source: "widely attributed" },
  { text: "Medicine is a moral enterprise.", author: "Edmund Pellegrino", source: "widely attributed" },
  { text: "Illness is the night-side of life, a more onerous citizenship.", author: "Susan Sontag", source: "Illness as Metaphor, 1978" },
  { text: "Our illnesses are not just biological conditions, but human ones.", author: "Arthur Kleinman", source: "The Illness Narratives, 1988" },
  { text: "The effective practice of medicine requires narrative competence: the ability to acknowledge, absorb, interpret, and act on the stories of others.", author: "Rita Charon", source: "JAMA, 2001" },
  { text: "Radical listening is the effort to be present, to bear witness, and to listen without your biases and assumptions.", author: "Rita Charon", source: "Women in Medicine Legacy Foundation Oral History, 2016" },
  { text: "What makes life meaningful enough to go on living?", author: "Paul Kalanithi", source: "When Breath Becomes Air, 2016" },
  { text: "Medicine is a social science, and politics is nothing more than medicine on a large scale.", author: "Rudolf Virchow", source: "1848, on the Upper Silesia typhus epidemic" },
  { text: "The physicians are the natural attorneys of the poor.", author: "Rudolf Virchow", source: "1848, on the Upper Silesia typhus epidemic" },
  { text: "Suffering occurs when an impending destruction of the person is perceived.", author: "Eric Cassell", source: "\"The Nature of Suffering and the Goals of Medicine,\" NEJM, 1982" },
  { text: "Autonomous actions should not be subject to controlling constraints by others.", author: "Beauchamp & Childress", source: "Principles of Biomedical Ethics" },
];

const COMPETENCIES = ["Patient Care", "Medical Knowledge", "Practice-Based Learning", "Interpersonal & Communication", "Professionalism", "Systems-Based Practice"];

const DAILY_PROMPTS = {
  "Patient Care": "Where did you balance protocol against what one specific patient needed?",
  "Medical Knowledge": "What did you understand today that you couldn't explain a month ago?",
  "Practice-Based Learning": "What feedback changed how you'll do something next time?",
  "Interpersonal & Communication": "Recall a conversation that didn't go as expected. What would you say differently?",
  "Professionalism": "Were you torn between two things you felt you owed someone?",
  "Systems-Based Practice": "What did the system do to a patient, independent of any one person's actions?",
};

const SDOH_TAGS = ["Housing", "Food access", "Transportation", "Insurance/cost", "Language", "Social support", "Employment", "Trust in system"];
const SETTINGS = ["Clinic", "Hospital", "Volunteering", "Shadowing"];
const STORAGE_KEY = "dharma_entries_v1";

function todayLabel() {
  return new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}
function todayShort() {
  return new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error("Could not load entries", e);
    return [];
  }
}
function saveEntries(entries) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  } catch (e) {
    console.error("Could not save entries", e);
  }
}

function CustomTagInput({ tags, setTags }) {
  const [val, setVal] = useState("");
  function add() {
    const v = val.trim();
    if (v && !tags.includes(v)) setTags([...tags, v]);
    setVal("");
  }
  return (
    <div className="customtag-row">
      {tags.map((t) => (
        <span key={t} className="tag custom">
          {t}
          <span onClick={() => setTags(tags.filter((x) => x !== t))} style={{ marginLeft: 5, cursor: "pointer" }}>×</span>
        </span>
      ))}
      <input
        className="customtag-input"
        placeholder="+ add tag"
        value={val}
        onChange={(e) => setVal(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && add()}
        onBlur={add}
      />
    </div>
  );
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function compileEntries(tag, entries) {
  const matching = entries.filter((e) => e.tags.includes(tag) || e.custom.includes(tag));
  const lines = [`Dharma — compiled entries: ${tag}`, `Generated ${new Date().toLocaleDateString()}`, `${matching.length} entr${matching.length === 1 ? "y" : "ies"}`, ""];
  matching.forEach((e) => {
    lines.push(`${e.date} · ${e.type.toUpperCase()}`);
    lines.push(e.snippet);
    const allTags = [...e.tags, ...e.custom].filter((t) => t !== tag);
    if (allTags.length) lines.push(`(also tagged: ${allTags.join(", ")})`);
    lines.push("");
  });
  return lines.join("\n");
}

function Dharma() {
  const [tab, setTab] = useState("today");
  const [quoteIdx] = useState(() => Math.floor(Math.random() * QUOTES.length));
  const [quoteReaction, setQuoteReaction] = useState("");

  const [competency, setCompetency] = useState(COMPETENCIES[0]);
  const [dailyEntry, setDailyEntry] = useState("");
  const [dailyCustom, setDailyCustom] = useState([]);

  const [weeklyEntry, setWeeklyEntry] = useState("");
  const [weeklyCustom, setWeeklyCustom] = useState([]);

  const [setting, setSetting] = useState(SETTINGS[0]);
  const [clinicalEntry, setClinicalEntry] = useState("");
  const [sdohTags, setSdohTags] = useState([]);
  const [clinicalCustom, setClinicalCustom] = useState([]);

  const [entries, setEntries] = useState(() => loadEntries());
  const [filterTag, setFilterTag] = useState(null);

  useEffect(() => { saveEntries(entries); }, [entries]);

  const quote = QUOTES[quoteIdx];

  function toggleSdoh(tag) {
    setSdohTags((prev) => (prev.includes(tag) ? prev.filter((t) => t !== tag) : [...prev, tag]));
  }

  function logDaily() {
    if (!dailyEntry.trim()) return;
    setEntries((p) => [{ date: todayShort(), type: "Daily", tags: [competency], custom: dailyCustom, snippet: dailyEntry.trim() }, ...p]);
    setDailyEntry(""); setDailyCustom([]);
  }
  function logWeekly() {
    if (!weeklyEntry.trim()) return;
    setEntries((p) => [{ date: todayShort(), type: "Weekly", tags: [], custom: weeklyCustom, snippet: weeklyEntry.trim() }, ...p]);
    setWeeklyEntry(""); setWeeklyCustom([]);
  }
  function logClinical() {
    if (!clinicalEntry.trim()) return;
    setEntries((p) => [{ date: todayShort(), type: setting, tags: sdohTags, custom: clinicalCustom, snippet: clinicalEntry.trim() }, ...p]);
    setClinicalEntry(""); setSdohTags([]); setClinicalCustom([]);
  }

  const visibleEntries = filterTag ? entries.filter((a) => a.tags.includes(filterTag) || a.custom.includes(filterTag)) : entries;
  const allTagsUsed = Array.from(new Set(entries.flatMap((e) => [...e.tags, ...e.custom])));

  function handleCompile() {
    if (!filterTag) return;
    const text = compileEntries(filterTag, entries);
    downloadText(`dharma-${filterTag.toLowerCase().replace(/\s+/g, "-")}.txt`, text);
  }

  return (
    <div className="root">
      {tab === "today" && (
        <div className="screen">
          <div className="wordmark serif">dharma</div>
          <div className="eyebrow">{todayLabel()}</div>
          <p className="bigquote serif">"{quote.text}"</p>
          <div className="quote-author mono">— {quote.author}, {quote.source}</div>
          <input className="reaction-input" placeholder="One line — does this land today, or push back on it?" value={quoteReaction} onChange={(e) => setQuoteReaction(e.target.value)} />

          <div className="sectiontitle mono">DAILY COMPETENCY</div>
          <div className="pillrow">
            {COMPETENCIES.map((c) => <span key={c} className={"pill" + (competency === c ? " active" : "")} onClick={() => setCompetency(c)}>{c}</span>)}
          </div>
          <p className="bigprompt">{DAILY_PROMPTS[competency]}</p>
          <textarea placeholder="Write a few sentences..." value={dailyEntry} onChange={(e) => setDailyEntry(e.target.value)} />
          <div className="tagblock-label mono">CUSTOM TAGS</div>
          <CustomTagInput tags={dailyCustom} setTags={setDailyCustom} />
          <br />
          <button className="savebtn" onClick={logDaily}>Log entry</button>
        </div>
      )}

      {tab === "weekly" && (
        <div className="screen">
          <div className="eyebrow">This week</div>
          <p className="bigprompt serif">What from this week is worth holding onto: a concept from class, a classmate, or something you noticed about yourself?</p>
          <textarea placeholder="Write freely..." value={weeklyEntry} onChange={(e) => setWeeklyEntry(e.target.value)} />
          <div className="tagblock-label mono">CUSTOM TAGS</div>
          <CustomTagInput tags={weeklyCustom} setTags={setWeeklyCustom} />
          <br />
          <button className="savebtn" onClick={logWeekly}>Log entry</button>
        </div>
      )}

      {tab === "clinical" && (
        <div className="screen">
          <div className="eyebrow">Clinical / volunteer</div>
          <div className="pillrow">
            {SETTINGS.map((s) => <span key={s} className={"pill" + (setting === s ? " active" : "")} onClick={() => setSetting(s)}>{s}</span>)}
          </div>
          <p className="bigprompt serif">What did this show you about the conditions shaping this patient's health, beyond the visit itself?</p>
          <textarea placeholder="Describe what happened and what it revealed..." value={clinicalEntry} onChange={(e) => setClinicalEntry(e.target.value)} />
          <div className="tagblock-label mono">SOCIAL DETERMINANTS</div>
          <div className="tagrow">
            {SDOH_TAGS.map((t) => <span key={t} className={"tag" + (sdohTags.includes(t) ? " on" : "")} onClick={() => toggleSdoh(t)}>{t}</span>)}
          </div>
          <div className="tagblock-label mono">CUSTOM TAGS</div>
          <CustomTagInput tags={clinicalCustom} setTags={setClinicalCustom} />
          <br />
          <button className="savebtn" onClick={logClinical}>Log entry</button>
        </div>
      )}

      {tab === "archive" && (
        <div className="screen">
          <div className="eyebrow">Archive {filterTag ? `· ${filterTag}` : ""}</div>

          {allTagsUsed.length > 0 && (
            <div className="tagrow" style={{ marginBottom: 20 }}>
              {allTagsUsed.map((t) => (
                <span key={t} className={"tag" + (filterTag === t ? " on" : "")} onClick={() => setFilterTag(t === filterTag ? null : t)}>{t}</span>
              ))}
            </div>
          )}

          {filterTag && (
            <button className="savebtn" style={{ marginBottom: 24 }} onClick={handleCompile}>
              Compile "{filterTag}" entries → download
            </button>
          )}

          {visibleEntries.length === 0 && (
            <p className="bigprompt" style={{ fontSize: 15, color: "var(--muted)" }}>
              {entries.length === 0 ? "No entries yet. Log something on Today, Weekly, or Clinical." : "No entries with this tag."}
            </p>
          )}

          {visibleEntries.map((item, i) => (
            <div className="archive-item" key={i}>
              <div className="archive-top">
                <span className="archive-date">{item.date}</span>
                <span className="archive-type">{item.type.toUpperCase()}</span>
              </div>
              <div className="archive-snippet">{item.snippet}</div>
              <div className="archive-tags">
                {item.tags.map((t) => <span key={t} className="tag on" style={{ cursor: "pointer" }} onClick={() => setFilterTag(t === filterTag ? null : t)}>{t}</span>)}
                {item.custom.map((t) => <span key={t} className="tag custom" style={{ cursor: "pointer" }} onClick={() => setFilterTag(t === filterTag ? null : t)}>{t}</span>)}
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="navbar">
        <div className={"navitem" + (tab === "today" ? " active" : "")} onClick={() => setTab("today")}>TODAY</div>
        <div className={"navitem" + (tab === "weekly" ? " active" : "")} onClick={() => setTab("weekly")}>WEEKLY</div>
        <div className={"navitem" + (tab === "clinical" ? " active" : "")} onClick={() => setTab("clinical")}>CLINICAL</div>
        <div className={"navitem" + (tab === "archive" ? " active" : "")} onClick={() => setTab("archive")}>ARCHIVE</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dharma />);
</script>

<style>
  .root {
    --bg: #F1ECDE;
    --paper: #1B2530;
    --rule: #D8D0B9;
    --sage: #55703F;
    --oxblood: #8B3A3A;
    --muted: #86806E;
    background: var(--bg);
    color: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .screen { flex: 1; padding: 56px 28px 32px; max-width: 620px; margin: 0 auto; width: 100%; }
  .eyebrow { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; }
  .wordmark { font-size: 15px; letter-spacing: 0.02em; color: var(--sage); margin-bottom: 6px; text-align: center; }

  .bigquote { font-size: clamp(28px, 6vw, 42px); line-height: 1.22; margin: 0 0 24px; font-weight: 400; letter-spacing: -0.01em; }
  .quote-author { font-size: 13px; color: var(--sage); margin-bottom: 36px; }
  .reaction-input {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--rule);
    color: var(--paper); font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; padding: 10px 0; outline: none; margin-bottom: 56px;
  }
  .reaction-input::placeholder { color: var(--muted); }

  .sectiontitle { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 14px; }
  .bigprompt { font-size: clamp(20px, 4vw, 26px); line-height: 1.3; margin: 0 0 22px; font-family: 'Source Serif 4', Georgia, serif; }

  .pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .pill { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; padding: 7px 13px; border: 1px solid var(--rule); color: var(--muted); cursor: pointer; }
  .pill.active { color: var(--bg); background: var(--paper); border-color: var(--paper); }

  textarea {
    width: 100%; background: transparent; border: 1px solid var(--rule); color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 1.55; padding: 14px; resize: vertical; min-height: 100px; outline: none;
  }
  textarea::placeholder { color: var(--muted); }

  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 10px; border: 1px solid var(--rule); color: var(--muted); cursor: pointer; user-select: none; display: inline-flex; align-items: center; }
  .tag.on { color: var(--bg); background: var(--sage); border-color: var(--sage); }
  .tag.custom { color: var(--oxblood); border-color: var(--oxblood); background: transparent; }
  .tagblock-label { font-size: 11px; color: var(--muted); margin: 18px 0 8px; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 7px; }
  .customtag-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .customtag-input {
    background: transparent; border: none; border-bottom: 1px solid var(--rule); color: var(--paper);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 5px 2px; outline: none; width: 90px;
  }
  .customtag-input::placeholder { color: var(--muted); }

  .savebtn {
    margin-top: 26px; background: transparent; border: 1px solid var(--sage); color: var(--sage);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 10px 18px; cursor: pointer; letter-spacing: 0.03em;
  }
  .savebtn:hover { background: var(--sage); color: var(--bg); }

  .archive-item { padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .archive-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .archive-date { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .archive-type { font-size: 11px; color: var(--oxblood); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.03em; }
  .archive-snippet { font-size: 16px; line-height: 1.5; margin-bottom: 10px; font-family: 'Source Serif 4', Georgia, serif; }
  .archive-tags { display: flex; gap: 6px; flex-wrap: wrap; }

  .navbar { position: sticky; bottom: 0; display: flex; border-top: 1px solid var(--rule); background: var(--bg); }
  .navitem {
    flex: 1; text-align: center; padding: 16px 0; color: var(--muted); cursor: pointer;
    font-size: 10px; letter-spacing: 0.03em; font-family: 'IBM Plex Mono', monospace;
  }
  .navitem.active { color: var(--paper); }
</style>
</body>
</html>
